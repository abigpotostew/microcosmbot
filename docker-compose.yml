version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}
      - PRISMA_ACCELERATE_ENABLED=${PRISMA_ACCELERATE_ENABLED}
      - NEXT_PUBLIC_ALCHEMY_ID=${NEXT_PUBLIC_ALCHEMY_ID}
      - NEXT_PUBLIC_BOT_DAO=${NEXT_PUBLIC_BOT_DAO}
      - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL}
      - BASEURL=${BASEURL}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
      - TELEGRAM_BOT_KEY=${TELEGRAM_BOT_KEY}
      - QSTASH_URL=${QSTASH_URL}
      - NEXT_PUBLIC_GETME_BOT_INFO=${NEXT_PUBLIC_GETME_BOT_INFO}
      - DISABLE_AUDIT_LOGS=${DISABLE_AUDIT_LOGS}
      - NEXT_PUBLIC_CHAINNAME=${NEXT_PUBLIC_CHAINNAME}
      - NEXT_PUBLIC_CHAINRESTURL=${NEXT_PUBLIC_CHAINRESTURL}
      - NEXT_PUBLIC_NETWORK=${NEXT_PUBLIC_NETWORK}
      - NEXT_PUBLIC_CHAINID=${NEXT_PUBLIC_CHAINID}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE}
      - CRON_SECRET=${CRON_SECRET}
      - QSTASH_TOKEN=${QSTASH_TOKEN}
      - QSTASH_CURRENT_SIGNING_KEY=${QSTASH_CURRENT_SIGNING_KEY}
      - QSTASH_NEXT_SIGNING_KEY=${QSTASH_NEXT_SIGNING_KEY}
      - ALLOWED_DENOMS=${ALLOWED_DENOMS}
      - TG_WEBHOOK_SECRET=${TG_WEBHOOK_SECRET}
      - SLACK_MONITOR_WEBHOOK=${SLACK_MONITOR_WEBHOOK}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ${DOCKER_NETWORK:-default}

networks:
  default:
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
    name: ${DOCKER_NETWORK:-microcosms_default}
